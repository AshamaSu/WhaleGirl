name: deploy

# 单人项目：main 分支测试通过即部署，不做 PR 预览与 staging
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 手动触发兜底

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 测试
        run: npm test

      - name: 部署到腾讯云
        if: success()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            fail() { echo "::error::$1"; exit 1; }
            if [ ! -d /opt/whale-girl/.git ]; then
              echo '首次部署：clone 仓库到 /opt/whale-girl'
              git clone https://github.com/AshamaSu/WhaleGirl.git /opt/whale-girl 2>&1 || fail 'clone 失败：检查服务器能否访问 github.com（curl -sI https://github.com 试试）'
            fi
            cd /opt/whale-girl || fail '/opt/whale-girl 不存在且 clone 失败'
            git fetch origin main 2>&1 || fail 'git fetch 失败：服务器网络或仓库访问问题'
            git reset --hard origin/main 2>&1 || fail 'git reset 失败：仓库状态异常'
            sudo -n systemctl restart whale-girl 2>&1 || fail 'systemctl restart 失败：whale-girl.service 未安装（先做手册第 4 节）或 sudo 未免密（第 7 节 visudo）'
            ok=0
            for i in 1 2 3 4 5; do
              sleep 2
              if curl -fsS http://127.0.0.1:8787/api/health > /dev/null 2>&1; then
                echo "部署完成，health 通过（第 $i 次探测）"
                ok=1
                break
              fi
            done
            [ "$ok" = "1" ] || { echo '::error::health 探测 5 次全失败：服务起了但 8787 没响应——journalctl -u whale-girl -n 30 看启动日志（多为 /etc/whale-girl.env 缺失或端口被占）'; git reset --hard ORIG_HEAD 2>/dev/null; sudo -n systemctl restart whale-girl 2>&1 || true; exit 1; }
