name: deploy

# 单人项目：main 分支测试通过即部署，不做 PR 预览与 staging。
# 服务器在国内直连 GitHub 不可靠，所以不走服务器侧 git pull：
# CI 打包 checkout 产物 → scp 上服务器 → 解包覆盖 → 重启 → 探活，失败回滚上一版。
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 手动触发兜底

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 测试
        run: npm test

      - name: 打包
        if: success()
        run: |
          if ! tar czf release.tgz --exclude='.git' --exclude='release.tgz' . 2>tar.err; then
            echo "::error::tar 打包失败：$(tail -3 tar.err | tr '\n' ' ')"
            exit 1
          fi
          ls -la release.tgz

      - name: 上传到服务器
        if: success()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: release.tgz
          target: /tmp

      - name: 解包并重启
        if: success()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            fail() { echo "::error::$1"; exit 1; }
            mkdir -p /opt/whale-girl
            # 留一份上一版包用于回滚
            [ -f /opt/whale-girl/release.tgz ] && cp /opt/whale-girl/release.tgz /tmp/release-prev.tgz || true
            tar xzf /tmp/release.tgz -C /opt/whale-girl
            cp /tmp/release.tgz /opt/whale-girl/release.tgz
            sudo -n systemctl restart whale-girl 2>&1 || fail 'systemctl restart 失败：whale-girl.service 未安装（先做手册第 4 节）或 sudo 未免密（第 7 节 visudo）'
            ok=0
            for i in 1 2 3 4 5; do
              sleep 2
              if curl -fsS http://127.0.0.1:8787/api/health > /dev/null 2>&1; then
                echo "部署完成，health 通过（第 $i 次探测）"
                ok=1
                break
              fi
            done
            [ "$ok" = "1" ] || {
              echo '::error::health 探测 5 次全失败：journalctl -u whale-girl -n 30 看启动日志（多为 /etc/whale-girl.env 缺失、Node 未装或端口被占）'
              if [ -f /tmp/release-prev.tgz ]; then tar xzf /tmp/release-prev.tgz -C /opt/whale-girl; fi
              sudo -n systemctl restart whale-girl 2>&1 || true
              exit 1
            }
