<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>蓝色小肥鱼</title>
<style>
  :root {
    --sea: #2f7fd6;
    --sea-deep: #1f5fa8;
    --ink: #1d2b3a;
    --muted: #7b8fa3;
    --line: #dbe7f1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #eaf4fb 0%, #f6fbfe 45%, #e6f1f9 100%);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(6px);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.75);
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: grid; place-items: center;
    color: #fff; font-size: 18px; font-weight: 600;
    background: radial-gradient(circle at 32% 28%, #7fc0f0, var(--sea) 62%, var(--sea-deep));
    box-shadow: 0 4px 10px rgba(47, 127, 214, 0.28);
    flex: none;
  }
  .who { display: flex; flex-direction: column; line-height: 1.35; flex: 1; min-width: 0; }
  .who b { font-size: 15px; letter-spacing: 0.5px; }
  .who span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header a {
    font-size: 12px; color: var(--sea-deep); text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; flex: none;
  }
  header a:hover { background: #fff; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px 18px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .msg { display: flex; gap: 8px; align-items: flex-end; }
  .msg.user { flex-direction: row-reverse; }
  .msg .avatar { width: 30px; height: 30px; font-size: 13px; }
  .bubbles { display: flex; flex-direction: column; gap: 6px; max-width: 76%; }
  .msg.user .bubbles { align-items: flex-end; }
  .bubble {
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    animation: pop 0.16s ease-out;
  }
  .msg.assistant .bubble {
    background: #fff;
    border: 1px solid var(--line);
    border-bottom-left-radius: 6px;
    box-shadow: 0 2px 8px rgba(31, 95, 168, 0.06);
  }
  .msg.user .bubble {
    background: linear-gradient(180deg, #4a92dd, var(--sea));
    color: #fff;
    border-bottom-right-radius: 6px;
  }
  .msg.user .bubble img { display: block; max-width: 220px; border-radius: 10px; margin-bottom: 6px; }
  .bubble.error {
    background: #fff3f3;
    border-color: #f3c9c9;
    color: #a33a3a;
    font-size: 13px;
  }
  .bubble.typing::after {
    content: "";
    display: inline-block;
    width: 2px; height: 1em;
    margin-left: 2px;
    vertical-align: -0.15em;
    background: var(--sea);
    animation: blink 1s steps(2, start) infinite;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 18px 18px;
    border-top: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.8);
  }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 11px 13px;
    font: inherit;
    font-size: 15px;
    line-height: 1.5;
    max-height: 132px;
    color: var(--ink);
    background: #fff;
    outline: none;
  }
  textarea:focus { border-color: #a9cdec; box-shadow: 0 0 0 3px rgba(47, 127, 214, 0.12); }
  button {
    border: 0;
    border-radius: 14px;
    padding: 12px 18px;
    font: inherit;
    font-size: 14px;
    color: #fff;
    background: linear-gradient(180deg, #4a92dd, var(--sea));
    cursor: pointer;
    transition: opacity 0.15s, transform 0.08s;
    flex: none;
  }
  button.ghost {
    background: #fff;
    color: var(--sea-deep);
    border: 1px solid var(--line);
    padding: 11px 13px;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.stop { background: #8aa4bb; }
  .hidden { display: none !important; }
  .chip {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 8px; align-self: flex-start;
  }
  .chip img { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; }
  .chip button { padding: 2px 7px; font-size: 12px; background: #eef4fa; color: var(--muted); }
  #status { font-size: 12px; color: var(--muted); padding: 0 18px 8px; min-height: 16px; }
  .mood {
    position: fixed; right: 16px; bottom: 96px; z-index: 5;
    width: 150px; padding: 10px 12px 8px;
    display: flex; flex-direction: column; gap: 4px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 6px 18px rgba(31, 95, 168, 0.12);
  }
  .mood-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .mood-head span { font-size: 12px; color: var(--muted); }
  .mood-head b { font-size: 18px; color: var(--sea-deep); font-variant-numeric: tabular-nums; }
  .mood svg { width: 100%; height: 26px; display: block; }
  .mood-hint { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (max-width: 560px) {
    .app { border: 0; }
    .bubbles { max-width: 84%; }
    header { padding: 10px 14px; }
    #chat { padding: 14px 14px 6px; }
    form { padding: 10px 14px 14px; }
    #status { padding: 0 14px 6px; }
    .mood { right: 10px; bottom: 92px; width: 128px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <!-- 名字的兜底值跟 personas/whale.json 的 name 一致；页面加载后由 /api/health 覆盖 -->
    <div class="avatar" id="avatar">蓝</div>
    <div class="who">
      <b id="who-name">蓝色小肥鱼</b>
      <span id="hint">正在连接…</span>
    </div>
    <a href="/memory" id="memory-link" class="hidden">记忆</a>
    <a href="/persona">调参</a>
  </header>

  <main id="chat"></main>
  <div id="status"></div>

  <form id="composer" autocomplete="off">
    <div class="chip hidden" id="image-chip">
      <img id="image-thumb" alt="待发送的图片">
      <span id="image-name">图片</span>
      <button type="button" id="image-remove">移除</button>
    </div>
    <div class="row">
      <button type="button" class="ghost" id="image-pick" title="发一张图">图片</button>
      <input type="file" id="image-input" accept="image/png,image/jpeg,image/webp,image/gif" class="hidden">
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button type="submit" id="send">发送</button>
      <button type="button" id="stop" class="stop hidden">停止</button>
    </div>
  </form>
</div>

<div class="mood hidden" id="mood">
  <div class="mood-head"><span id="mood-label">平静</span><b id="mood-value">60</b></div>
  <svg viewBox="0 0 120 26" preserveAspectRatio="none" aria-hidden="true">
    <polyline id="mood-line" fill="none" stroke="#2f7fd6" stroke-width="1.6" stroke-linejoin="round" points="0,13 120,13"></polyline>
  </svg>
  <div class="mood-hint" id="mood-hint">最近没什么起伏</div>
</div>

<script>
(function () {
  'use strict';

  var chatEl = document.getElementById('chat');
  var form = document.getElementById('composer');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var stopBtn = document.getElementById('stop');
  var hintEl = document.getElementById('hint');
  var nameEl = document.getElementById('who-name');
  var avatarEl = document.getElementById('avatar');
  var statusEl = document.getElementById('status');
  var imagePick = document.getElementById('image-pick');
  var imageInput = document.getElementById('image-input');
  var imageChip = document.getElementById('image-chip');
  var imageThumb = document.getElementById('image-thumb');
  var imageRemove = document.getElementById('image-remove');
  var memoryLink = document.getElementById('memory-link');
  var moodEl = document.getElementById('mood');
  var moodLabelEl = document.getElementById('mood-label');
  var moodValueEl = document.getElementById('mood-value');
  var moodLineEl = document.getElementById('mood-line');
  var moodHintEl = document.getElementById('mood-hint');

  var SESSION_KEY = 'whale_session';
  var sessionId = localStorage.getItem(SESSION_KEY);
  if (!sessionId) {
    sessionId = 's' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem(SESSION_KEY, sessionId);
  }

  var imageData = '';
  var controller = null;
  var streaming = false;
  var maxBubbles = 3;

  function nearBottom() {
    return chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 80;
  }

  function scrollToBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function makeAvatar() {
    var el = document.createElement('div');
    el.className = 'avatar';
    el.textContent = avatarEl.textContent;
    return el;
  }

  function pushUser(text, image) {
    var row = document.createElement('div');
    row.className = 'msg user';
    var bubbles = document.createElement('div');
    bubbles.className = 'bubbles';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (image) {
      var img = document.createElement('img');
      img.src = image;
      img.alt = '我发的图片';
      bubble.appendChild(img);
    }
    if (text) bubble.appendChild(document.createTextNode(text));

    bubbles.appendChild(bubble);
    row.appendChild(bubbles);
    chatEl.appendChild(row);
    scrollToBottom();
  }

  function pushError(text) {
    var row = document.createElement('div');
    row.className = 'msg assistant';
    var bubbles = document.createElement('div');
    bubbles.className = 'bubbles';
    var bubble = document.createElement('div');
    bubble.className = 'bubble error';
    bubble.textContent = text;
    bubbles.appendChild(bubble);
    row.appendChild(makeAvatar());
    row.appendChild(bubbles);
    chatEl.appendChild(row);
    scrollToBottom();
  }

  function splitBubbles(text, limit) {
    var parts = text.split('\n').map(function (line) {
      return line.trim();
    }).filter(function (line) {
      return line !== '';
    });
    if (parts.length > limit) {
      var head = parts.slice(0, limit - 1);
      head.push(parts.slice(limit - 1).join(' '));
      parts = head;
    }
    return parts;
  }

  function present(text) {
    var out = text.replace(/[。～~]+$/g, '').replace(/[～~]+/g, ' ').trim();
    return out === '' ? text : out;
  }

  function createGroup() {
    var row = document.createElement('div');
    row.className = 'msg assistant';
    var bubbles = document.createElement('div');
    bubbles.className = 'bubbles';
    row.appendChild(makeAvatar());
    row.appendChild(bubbles);
    chatEl.appendChild(row);

    return {
      paint: function (text, typing) {
        var stick = nearBottom();
        var parts = splitBubbles(text, maxBubbles);
        bubbles.innerHTML = '';
        for (var i = 0; i < parts.length; i += 1) {
          var bubble = document.createElement('div');
          bubble.className = 'bubble';
          bubble.textContent = present(parts[i]);
          if (typing && i === parts.length - 1) bubble.className += ' typing';
          bubbles.appendChild(bubble);
        }
        if (stick) scrollToBottom();
      },
      remove: function () {
        row.remove();
      },
    };
  }

  /** 心情挂件：数值 + 近 24h 曲线，跟着 SSE 实时变 */
  function renderMood(mood) {
    if (!mood) return;
    moodEl.classList.remove('hidden');
    moodLabelEl.textContent = mood.label || '平静';
    moodValueEl.textContent = typeof mood.value === 'number' ? String(mood.value) : '';

    var history = Array.isArray(mood.history) ? mood.history : [];
    var points = '0,13 120,13';
    if (history.length >= 2) {
      var values = history.map(function (item) { return Number(item.value) || 0; });
      var min = Math.min.apply(null, values);
      var max = Math.max.apply(null, values);
      if (max - min < 4) {
        min -= 2;
        max += 2;
      }
      var span = max - min || 1;
      points = values.map(function (value, index) {
        var x = (index / (values.length - 1)) * 120;
        var y = 24 - ((value - min) / span) * 22;
        return x.toFixed(1) + ',' + y.toFixed(1);
      }).join(' ');
    }
    moodLineEl.setAttribute('points', points);

    var last = history[history.length - 1];
    moodHintEl.textContent = last && last.reason ? last.reason : '最近没什么起伏';
  }

  function loadMood() {
    fetch('/api/mood')
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) { if (data && data.mood) renderMood(data.mood); })
      .catch(function () {});
  }

  /** 能力主动发过来的话（以后是主动搭话 / B站分享），当成她说话插进聊天 */
  function pushProactive(text) {
    if (!text) return;
    var group = createGroup();
    group.paint(String(text), false);
  }

  function connectEvents() {
    if (typeof EventSource !== 'function') return;
    var source = new EventSource('/api/events');
    source.onmessage = function (event) {
      var data;
      try {
        data = JSON.parse(event.data);
      } catch (err) {
        return;
      }
      if (data.type === 'mood') renderMood(data.mood);
      else if (data.type === 'push') pushProactive(data.text);
    };
  }

  function setBusy(busy) {
    streaming = busy;
    sendBtn.disabled = busy;
    stopBtn.classList.toggle('hidden', !busy);
    imagePick.disabled = busy;
    if (!busy) input.focus();
  }

  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 132) + 'px';
  }

  function setStatus(text) {
    statusEl.textContent = text || '';
  }

  function setPersona(name) {
    if (!name) return;
    nameEl.textContent = name;
    avatarEl.textContent = name.charAt(0);
    document.title = name;
  }

  async function chat(text) {
    pushUser(text, imageData);
    var sendingImage = imageData;
    clearImage();
    setBusy(true);
    setStatus('');

    controller = new AbortController();
    var group = createGroup();
    var full = '';
    var failure = null;
    var settled = false;

    var payload = { sessionId: sessionId, message: text };
    if (sendingImage) payload.image = sendingImage;

    try {
      var res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload),
        signal: controller.signal,
      });

      if (!res.ok) {
        var detail = null;
        try {
          detail = await res.json();
        } catch (ignore) {
          detail = null;
        }
        throw new Error((detail && detail.error) || ('服务返回 ' + res.status));
      }

      var reader = res.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buffer = '';

      for (;;) {
        var step = await reader.read();
        if (step.done) break;
        buffer += decoder.decode(step.value, { stream: true });

        var index = buffer.indexOf('\n\n');
        while (index !== -1) {
          var block = buffer.slice(0, index);
          buffer = buffer.slice(index + 2);
          var lines = block.split('\n');
          for (var i = 0; i < lines.length; i += 1) {
            if (lines[i].indexOf('data:') !== 0) continue;
            var event = null;
            try {
              event = JSON.parse(lines[i].slice(5).trim());
            } catch (ignore) {
              event = null;
            }
            if (!event) continue;

            if (event.type === 'meta') {
              if (event.maxBubbles) maxBubbles = event.maxBubbles;
              setPersona(event.persona);
              var bits = [event.provider + ' · ' + event.model];
              if (event.memory && event.memory.facts) bits.push('记得 ' + event.memory.facts + ' 件事');
              if (event.memory && event.memory.summary) bits.push('有摘要');
              hintEl.textContent = bits.join(' · ');
            } else if (event.type === 'tool') {
              setStatus('正在用 ' + event.name + (event.ok === false ? '（失败了，她会自己想办法）' : '…'));
            } else if (event.type === 'delta') {
              full += event.text;
              group.paint(full, true);
            } else if (event.type === 'error') {
              failure = event.message || '出错了';
              if (event.partial) full = event.partial;
            }
          }
          index = buffer.indexOf('\n\n');
        }
      }
      settled = true;
    } catch (err) {
      failure = err && err.name === 'AbortError' ? '已停止' : (err && err.message) || String(err);
    } finally {
      controller = null;
      setBusy(false);
      setStatus('');
    }

    if (full.trim() === '') group.remove();
    else group.paint(full, false);

    if (failure && failure !== '已停止') pushError(failure);
    if (!settled && failure === '已停止') setStatus('已停止，可以接着说');
  }

  function clearImage() {
    imageData = '';
    imageChip.classList.add('hidden');
    imageInput.value = '';
  }

  imagePick.addEventListener('click', function () {
    imageInput.click();
  });

  imageInput.addEventListener('change', function () {
    var file = imageInput.files && imageInput.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      setStatus('图片太大了，2MB 以内');
      imageInput.value = '';
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      imageData = String(reader.result);
      imageThumb.src = imageData;
      document.getElementById('image-name').textContent = file.name + '（' + Math.round(file.size / 1024) + 'KB）';
      imageChip.classList.remove('hidden');
      setStatus('');
    };
    reader.onerror = function () {
      setStatus('读不到这个文件');
      imageInput.value = '';
    };
    reader.readAsDataURL(file);
  });

  imageRemove.addEventListener('click', clearImage);

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (streaming) return;
    var text = input.value.trim();
    if (text === '' && imageData === '') return;
    input.value = '';
    autosize();
    chat(text);
  });

  input.addEventListener('keydown', function (event) {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener('input', autosize);

  stopBtn.addEventListener('click', function () {
    if (controller) controller.abort();
  });

  fetch('/api/health')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      setPersona(data.personaName);
      hintEl.textContent = data.provider + ' · ' + data.model;

      var features = data.features || {};
      if (features.memory && features.memory.enabled) memoryLink.classList.remove('hidden');
      if (features.mood && features.mood.enabled) {
        moodEl.classList.remove('hidden');
        loadMood();
      }
      connectEvents();
    })
    .catch(function () {
      hintEl.textContent = '连不上服务，确认 node server.js 还在跑';
    });

  input.focus();
})();
</script>
</body>
</html>
