<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理员登录</title>
<style>
  :root { --sea: #2f7fd6; --ink: #1d2b3a; --muted: #7b8fa3; --line: #dbe7f1; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 18px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #eaf4fb 0%, #f6fbfe 45%, #e6f1f9 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 24px;
    width: 340px;
    box-shadow: 0 4px 14px rgba(31, 95, 168, 0.06);
  }
  h1 { font-size: 17px; margin: 0 0 6px; }
  p.tip { font-size: 12px; color: var(--muted); margin: 0 0 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input[type=password] {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; font: inherit; font-size: 14px; color: var(--ink);
    background: #fff;
  }
  button {
    margin-top: 14px; width: 100%;
    border: 0; border-radius: 10px; padding: 10px 0;
    background: var(--sea); color: #fff; font: inherit; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: default; }
  .err { margin-top: 10px; font-size: 12px; color: #a33a3a; min-height: 16px; }
</style>
</head>
<body>
<div class="card">
  <h1>管理员登录</h1>
  <p class="tip">输入部署时设置的 WG_ADMIN_TOKEN；不登录也能以访客身份聊天。</p>
  <form id="form">
    <label for="token">访问令牌</label>
    <input type="password" id="token" autocomplete="current-password" autofocus>
    <button type="submit" id="go">登录</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
(function () {
  var form = document.getElementById('form');
  var token = document.getElementById('token');
  var go = document.getElementById('go');
  var err = document.getElementById('err');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    go.disabled = true;
    err.textContent = '';
    fetch('/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ token: token.value }),
    }).then(function (r) { return r.json().then(function (b) { return { s: r.status, b: b }; }); })
      .then(function (res) {
        if (res.b && res.b.ok) { location.href = '/'; return; }
        err.textContent = (res.b && res.b.error) || ('登录失败（' + res.s + '）');
        go.disabled = false;
      })
      .catch(function (e2) { err.textContent = '请求失败：' + e2.message; go.disabled = false; });
  });
})();
</script>
</body>
</html>
